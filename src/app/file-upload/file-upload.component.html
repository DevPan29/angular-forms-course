<!-- usually when we need to implement a custom upload button we use a input type=file hidden
 because is very hard to give it a custom style-->
<input type="file" class="file-input" #fileUpload
(change)="onFileSelected($event)">

<div class="file-upload">
  <mat-form-field>
    <input matInput [disabled]="true"  type="text" [value]="fileName">
  </mat-form-field>
  <button mat-mini-fab color="primary" class="upload-btn"
  (click)="onClick(fileUpload)" [disabled]="disabled">
    <mat-icon>attach_file</mat-icon>
  </button>
</div>

<mat-progress-bar
  class="progress-bar"
  *ngIf="uploadProgress"
  mode="determinate" [value]="uploadProgress"></mat-progress-bar>
